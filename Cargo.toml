[package]
name = "codex-chat-bridge"
version = "0.4.0"
edition = "2021"

[[bin]]
name = "codex-chat-bridge"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dashmap = "6"
async-stream = "0.3"
futures = "0.3"
prometheus = { version = "0.13", default-features = false }
regex-lite = "0.1"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Exposes `bench_api`, a `#[doc(hidden)]` re-export of internal conversion
# entrypoints for the criterion benches. Off by default so the public surface
# stays exactly the binary's — the internals never leak into a normal build.
[features]
bench = []

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
base64 = "0.22"
proptest = "1"
criterion = "0.5"

[[bench]]
name = "conversion"
harness = false
required-features = ["bench"]

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
